name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DnD-Soundboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DnD-Soundboard-apk
          path: DnD-Soundboard.apk
      - name: Prova reale YouTube (informativa)
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*NetworkTest*' -PnetworkTests=true -i | grep -E "Titolo:|URL:|Scaricati|Openverse:|FAILED|Exception|PASSED|SKIPPED" || true
