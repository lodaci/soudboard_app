name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DnD-Soundboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DnD-Soundboard-apk
          path: DnD-Soundboard.apk
